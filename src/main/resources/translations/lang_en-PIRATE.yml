      - "Sent 'em to Davy Jones' locker"
      - "Cry harder, ye bilge rat."
      - "Aye"
      - "Good riddance to bad cargo"
      - "Ye got a letter of marque fer that behavior?"
      - "No privateer's license? Off the plank with ye!"
